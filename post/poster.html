<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Постер — отбор на чемпионат «Профессионалы»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #6f757a; }
  :root {
    --green: #0F9346;
    --green-lite: #4ECC0A;
    --yellow: #FCEE73;
    --grey: #BDC6CB;
    --dark: #364046;
    --white: #FFFFFF;
  }

  .poster {
    position: relative;
    width: 1080px; height: 1350px;
    overflow: hidden;
    font-family: 'Roboto', Arial, sans-serif;
    color: var(--white);
    isolation: isolate;
  }

  /* ---------- Фон: снимок антенны во весь постер ----------
     Исходник assets/background.jpg — 4928x3280 (альбомный).
     Постер 1080x1350 (книжный): cover масштабирует по высоте, поэтому
     по горизонтали видно лишь 53% кадра. Смещение 64% ставит антенну
     в правую часть (примерно x 560–960), оставляя левую под текст. */
  .poster > .bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 64% 50%;
    z-index: 0;
  }

  /* ---------- Общее затемнение: лёгкое ----------
     Задача — не гасить фотографию, а лишь приглушить её,
     чтобы белый логотип и подвал читались. */
  .poster > .scrim {
    position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(to bottom,
        rgba(6,12,9,.50) 0%,
        rgba(6,12,9,.10) 16%,
        rgba(6,12,9,0) 34%),
      linear-gradient(to top,
        rgba(6,12,9,.55) 0%,
        rgba(6,12,9,.22) 9%,
        rgba(6,12,9,0) 24%);
  }

  /* ---------- Мягкое пятно под текстовой колонкой ----------
     Локальное затемнение вместо сплошной заливки: снимок остаётся
     видимым справа и по краям, а колонка гарантированно читаема. */
  .poster > .fog {
    position: absolute; inset: 0; z-index: 2;
    background:
      radial-gradient(ellipse 62% 26% at 28% 40%,
        rgba(4,10,7,.80) 0%, rgba(4,10,7,.60) 44%, rgba(4,10,7,0) 74%),
      radial-gradient(ellipse 42% 22% at 28% 70%,
        rgba(4,10,7,.70) 0%, rgba(4,10,7,.42) 48%, rgba(4,10,7,0) 76%);
  }

  /* ---------- Полоса логотипов ---------- */
  .topbar {
    position: absolute; z-index: 5;
    top: 0; left: 0; right: 0;
    height: 190px;
    padding: 0 54px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(6,12,9,.55), rgba(6,12,9,0));
    border-bottom: 3px solid var(--green-lite);
  }
  .topbar .champ-wrap {
    position: relative;
    height: 116px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.55));
  }
  .topbar .champ { height: 116px; width: auto; display: block; }

  /* Пунктирная рамка «ПОЛЕ ДЛЯ ВВОДА ГОДА» — заготовка брендбука.
     Закрываем её фирменной плашкой с годом: в финальном знаке это
     и есть заполненное поле. Координаты — доли от размеров логотипа
     1218x450: поле занимает x 45.2–61.2%, y 4.4–18.8%. */
  .topbar .champ-year {
    position: absolute;
    left: 45.2%; top: 4.4%;
    width: 16%; height: 14.4%;
    background: var(--green);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 900; letter-spacing: .5px;
    color: var(--white);
  }
  .topbar .college-plate {
    flex: none;
    background: var(--white);
    border-radius: 20px;
    padding: 9px 11px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .topbar .college-plate img { height: 84px; width: auto; display: block; }

  /* ---------- Заголовок ---------- */
  .content {
    position: absolute; z-index: 5;
    left: 54px; top: 300px;
    width: 536px;
  }

  .eyebrow {
    font-size: 21px; font-weight: 700; letter-spacing: 3.4px;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .eyebrow .dot { color: var(--yellow); margin: 0 10px; }

  h1 {
    margin-top: 16px;
    font-size: 76px; line-height: 1.0; font-weight: 900;
    letter-spacing: -1.6px;
    text-shadow: 0 3px 14px rgba(0,0,0,.55);
  }

  h2 {
    margin-top: 14px;
    font-size: 42px; line-height: 1.16; font-weight: 900;
    color: var(--green-lite);
    letter-spacing: -.5px;
    text-shadow: 0 3px 14px rgba(0,0,0,.6);
  }

  .rule { display: flex; align-items: center; margin: 26px 0 0; }
  .rule .bar { height: 6px; flex: 1 1 auto;
    background: linear-gradient(90deg, var(--green-lite) 0%, var(--green) 100%); }
  .rule .arrow { width: 0; height: 0; margin-left: 2px;
    border-top: 13px solid transparent; border-bottom: 13px solid transparent;
    border-left: 22px solid var(--green); }

  /* ---------- Блок текста: отдельная тёмная плашка ----------
     Ниже QR-карточки, та же левая кромка. Намеренно не на белом:
     так код и текст читаются как два разных объекта. */
  .textblock {
    position: absolute; z-index: 5;
    left: 54px; top: 996px;
    width: 470px;
    background: rgba(8, 16, 12, .74);
    backdrop-filter: blur(6px);
    border-left: 5px solid var(--green-lite);
    border-radius: 0 18px 18px 0;
    padding: 20px 24px 22px;
  }
  .textblock h3 { font-size: 28px; font-weight: 900; line-height: 1.18; color: var(--white); white-space: nowrap; }
  .textblock h3 em { font-style: normal; color: var(--green-lite); }
  .textblock p { margin-top: 9px; font-size: 18px; line-height: 1.36; font-weight: 400; color: #D3DBD8; }
  .textblock .contact {
    margin-top: 12px; padding-top: 11px;
    border-top: 1px solid rgba(255,255,255,.16);
    font-size: 18px; font-weight: 700; color: var(--yellow);
  }

  /* ---------- Блок QR: отдельная белая карточка ----------
     Стоит сразу под зелёной стрелкой (она заканчивается на y 618)
     и выровнен по левому краю колонки. Антенна занимает примерно
     x 560–960, y 800–1270, карточка заканчивается на x 318 — до неё
     более 240 px. */
  .qrblock {
    position: absolute; z-index: 5;
    left: 54px; top: 692px;
    width: 264px; height: 264px;
    background: var(--white);
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
  }
  .qrblock img { width: 216px; height: 216px; display: block; }

  /* ---------- Подвал ---------- */
  .footer {
    position: absolute; z-index: 5;
    left: 0; right: 0; bottom: 0;
    height: 104px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 54px;
    background: rgba(54, 64, 70, .86);
    backdrop-filter: blur(3px);
  }
  .slogan { font-size: 25px; font-weight: 700; }
  .fright .tag { font-size: 19px; font-weight: 700; letter-spacing: 1.1px; color: var(--grey); }
  .accentbar {
    position: absolute; z-index: 6;
    left: 0; right: 0; bottom: 104px;
    height: 8px;
    background: linear-gradient(90deg, var(--green) 0%, var(--green-lite) 55%, var(--yellow) 100%);
  }
</style>
</head>
<body>
<div class="poster">

  <img class="bg" src="../assets/background.jpg" alt="">

  <div class="scrim"></div>
  <div class="fog"></div>

  <div class="topbar">
    <div class="champ-wrap">
      <img class="champ" src="../assets/professionals_logo_02-1_white.png"
           alt="Чемпионат по профессиональному мастерству «Профессионалы»">
      <span class="champ-year">2026</span>
    </div>
    <div class="college-plate">
      <img src="../assets/college_logo.svg" alt="Ставропольский колледж связи им. В.А. Петрова">
    </div>
  </div>

  <div class="content">
    <div class="eyebrow">Отбор студентов<span class="dot">•</span>2026</div>
    <h1>Набор<br>на чемпионат</h1>
    <h2>Программные решения для бизнеса</h2>
    <div class="rule"><div class="bar"></div><div class="arrow"></div></div>
  </div>

  <div class="qrblock">
    <img src="../assets/qr_repo.png" alt="QR-код на условия отбора">
  </div>

  <div class="textblock">
    <h3>Всё о компетенции —<br><em>по ссылке</em></h3>
    <p>Отсканируйте QR-код. На отбор присылайте ссылку на свою работу.</p>
    <div class="contact">Запись и вопросы — кабинет 202л</div>
  </div>

  <div class="footer">
    <div class="slogan">профессионалы. сделано в россии!</div>
    <div class="fright">
      <div class="tag">#ПРОФЕССИОНАЛЫСДЕЛАНОВРОССИИ</div>
    </div>
  </div>
  <div class="accentbar"></div>

</div>
</body>
</html>
