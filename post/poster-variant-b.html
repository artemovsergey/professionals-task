<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вариант B — зелёный, отбор на чемпионат «Профессионалы»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Вариант B — инверсия варианта A. Фон — фирменный зелёный #4ECC0A,
     типография чёрная #1D1D1B. Фотографии нет: только знак, шевроны,
     кубический паттерн и чёрные плиты как структура. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #6f757a; }
  :root {
    --green: #4ECC0A;
    --mid: #398411;
    --dark: #1D1D1B;
    --white: #FFFFFF;
  }

  .poster {
    position: relative;
    width: 1080px; height: 1350px;
    overflow: hidden;
    background: var(--green);
    font-family: 'Roboto', Arial, sans-serif;
    color: var(--dark);
    isolation: isolate;
  }

  .pattern {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: .10;
    z-index: 0;
  }
  /* Шевроны из брендбука залиты #4ECC0A, то есть на зелёном фоне
     варианта B они невидимы. brightness(0) сводит любой цвет к чёрному. */
  .chevrons {
    position: absolute; z-index: 0;
    left: -80px; bottom: 120px;
    width: 760px;
    filter: brightness(0);
    opacity: .10;
  }

  .topbar {
    position: absolute; z-index: 4;
    top: 0; left: 0; right: 0; height: 8px;
    background: var(--dark);
  }

  /* ---------- Знак: чёрная версия, год в чёрной плашке ---------- */
  .champ-wrap {
    position: absolute; z-index: 5;
    left: 54px; top: 50px;
  }
  .champ-wrap img { height: 100px; width: auto; display: block; }
  .champ-year {
    position: absolute;
    left: 44.6%; top: 3.4%;
    width: 17.2%; height: 17.0%;
    background: var(--dark);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 900; letter-spacing: .5px;
    color: var(--green);
  }

  .college-plate {
    position: absolute; z-index: 5;
    right: 54px; top: 44px;
    background: var(--white);
    border-radius: 22px;
    padding: 13px 15px;
    box-shadow: 0 8px 24px rgba(29,29,27,.28);
  }
  .college-plate img { height: 136px; width: auto; display: block; }

  /* ---------- Типографика ---------- */
  .content {
    position: absolute; z-index: 5;
    left: 54px; top: 262px;
    width: 972px;
  }
  .eyebrow {
    font-size: 21px; font-weight: 700; letter-spacing: 3.4px;
    text-transform: uppercase; color: var(--dark);
  }
  .eyebrow .dot { margin: 0 10px; }

  h1 {
    margin-top: 18px;
    font-size: 96px; line-height: .98; font-weight: 900;
    letter-spacing: -2.6px; color: var(--dark);
  }

  /* Компетенция — белым по чёрной плите: сильный графический блок */
  .plate-band {
    margin-top: 22px;
    display: inline-block;
    background: var(--dark);
    padding: 16px 34px 18px;
  }
  .plate-band h2 {
    font-size: 48px; line-height: 1.06; font-weight: 900;
    letter-spacing: -1px; color: var(--white);
  }

  /* ---------- QR отдельным блоком: белая плита в чёрной рамке ---------- */
  .qrblock {
    position: absolute; z-index: 5;
    left: 54px; top: 838px;
    width: 264px; height: 264px;
    background: var(--white);
    border: 8px solid var(--dark);
    display: flex; align-items: center; justify-content: center;
  }
  .qrblock img { width: 232px; height: 232px; display: block; }

  /* ---------- Слова отдельным блоком ---------- */
  .textblock {
    position: absolute; z-index: 5;
    left: 354px; top: 838px;
    width: 672px;
    background: var(--dark);
    padding: 28px 32px 30px;
  }
  .textblock h3 { font-size: 33px; font-weight: 900; line-height: 1.16;
    color: var(--white); white-space: nowrap; }
  .textblock h3 em { font-style: normal; color: var(--green); }
  .textblock p { margin-top: 12px; font-size: 21px; line-height: 1.38; font-weight: 400; color: #D6D9D7; }
  .textblock .contact {
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid rgba(78,204,10,.4);
    font-size: 21px; font-weight: 700; color: var(--green);
  }

  /* ---------- Подвал ---------- */
  .footer {
    position: absolute; z-index: 6;
    left: 0; right: 0; bottom: 0;
    height: 104px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 54px;
    background: var(--dark);
  }
  .footer .tag { font-size: 22px; font-weight: 700; letter-spacing: 1.3px; color: var(--white); }
</style>
</head>
<body>
<div class="poster">

  <img class="pattern" src="../assets/pattern-cubes.png" alt="">
  <img class="chevrons" src="../assets/chevrons.svg" alt="">
  <div class="topbar"></div>

  <div class="champ-wrap">
    <img src="../assets/professionals_logo_02-1_black.png"
         alt="Чемпионат по профессиональному мастерству «Профессионалы»">
    <span class="champ-year">2027</span>
  </div>

  <div class="college-plate">
    <img src="../assets/college_logo.svg" alt="Ставропольский колледж связи им. В.А. Петрова">
  </div>

  <div class="content">
    <div class="eyebrow">Отбор студентов<span class="dot">•</span>2027</div>
    <h1>Набор<br>на чемпионат</h1>
    <div class="plate-band">
      <h2>Программные решения<br>для бизнеса</h2>
    </div>
  </div>

  <div class="qrblock">
    <img src="../assets/qr_repo.png" alt="QR-код на условия отбора">
  </div>

  <div class="textblock">
    <h3>Всё о компетенции — <em>по ссылке</em></h3>
    <p>Отсканируйте QR-код. На отбор присылайте ссылку на свою работу.</p>
    <div class="contact">Запись и вопросы — кабинет 202л</div>
  </div>

  <div class="footer">
    <div class="tag">#ПРОФЕССИОНАЛЫСДЕЛАНОВРОССИИ</div>
  </div>

</div>
</body>
</html>
