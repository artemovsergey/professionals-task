          maxLength: 200
          minLength: 1
          type: string
        intervalDays:
          maximum: 3650
          minimum: 1
          type: integer
          format: int32
        description:
          maxLength: 500
          minLength: 0
          type: string
          nullable: true
      additionalProperties: false
    CreateMaterialDto:
