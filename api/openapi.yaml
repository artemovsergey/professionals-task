components:
  schemas:
    AddCrewMemberDto:
      required:
      - userId
      type: object
      properties:
        userId:
          type: string
          format: uuid
      additionalProperties: false
    AnalyticsReport:
      type: object
      properties:
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        downtime:
          type: array
          items:
            $ref: '#/components/schemas/DowntimeSlice'
          nullable: true
        crews:
          type: array
          items:
            $ref: '#/components/schemas/CrewEfficiency'
          nullable: true
        materials:
          type: array
          items:
            $ref: '#/components/schemas/MaterialUsage'
          nullable: true
        plan:
          type: array
          items:
            $ref: '#/components/schemas/PlanExecutionSlice'
          nullable: true
        orders:
          $ref: '#/components/schemas/OrdersSummary'
      additionalProperties: false
    AnalyticsReportApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AnalyticsReport'
        message:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
      additionalProperties: false
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
      additionalProperties: false
    AssignCrewDto:
      required:
      - crewId
      type: object
      properties:
        crewId:
          type: string
          format: uuid
        assignedTo:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
    ChangeStatusDto:
      required:
      - status
      type: object
      properties:
        status:
          minLength: 1
          type: string
        reason:
          maxLength: 1000
          minLength: 0
          type: string
          nullable: true
      additionalProperties: false
    ChangeStatusRequest:
      type: object
      properties:
        status:
          type: string
          description: 'Одно из значений: Работает, В ремонте, Выведено из эксплуатации.'
          nullable: true
      additionalProperties: false
      description: Тело запроса смены статуса оборудования.
    CompleteMaintenanceScheduleDto:
      required:
      - completedDate
      type: object
      properties:
        completedDate:
          type: string
          format: date
        actualCost:
          maximum: 1.7976931348623157e+308
          minimum: 0
          type: number
          format: double
          nullable: true
      additionalProperties: false
    CompleteWorkOrderDto:
      required:
      - actualEnd
      - failureReason
      type: object
      properties:
        actualEnd:
          type: string
          format: date-time
        failureReason:
          maxLength: 1000
          minLength: 1
          type: string
        comment:
          maxLength: 1000
          minLength: 0
          type: string
          nullable: true
      additionalProperties: false
    CreateCrewDto:
      required:
      - code
      - name
      type: object
      properties:
        code:
          maxLength: 20
          minLength: 1
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        specialty:
          maxLength: 500
          minLength: 0
          type: string
          nullable: true
        isActive:
          type: boolean
      additionalProperties: false
    CreateEquipmentDto:
      required:
      - commissionDate
      - inventoryNumber
      - name
      - status
      - workshopId
      type: object
      properties:
        inventoryNumber:
          maxLength: 50
          minLength: 1
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        workshopId:
          type: string
          format: uuid
        manufacturer:
          maxLength: 150
          minLength: 0
          type: string
          nullable: true
        model:
          maxLength: 100
          minLength: 0
          type: string
          nullable: true
        serialNumber:
          maxLength: 100
          minLength: 0
          type: string
          nullable: true
        commissionDate:
          type: string
          format: date
        decommissionDate:
          type: string
          format: date
          nullable: true
        status:
          minLength: 1
          type: string
        criticality:
          maximum: 5
          minimum: 1
          type: integer
          format: int32
        location:
          maxLength: 200
          minLength: 0
          type: string
          nullable: true
        notes:
          maxLength: 1000
          minLength: 0
          type: string
          nullable: true
      additionalProperties: false
    CreateMaintenanceScheduleDto:
      required:
      - equipmentId
      - maintenanceTypeId
      - plannedDate
      type: object
      properties:
        equipmentId:
          type: string
          format: uuid
        maintenanceTypeId:
          type: string
          format: uuid
        plannedDate:
          type: string
          format: date
        notes:
          maxLength: 500
          minLength: 0
          type: string
          nullable: true
      additionalProperties: false
    CreateMaintenanceTypeDto:
      required:
