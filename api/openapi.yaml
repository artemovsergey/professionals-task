# Спецификация API системы «ТОиР-Проф».
#
# Файл получен из работающего приложения: Swagger собирает описание
# из атрибутов контроллеров и XML-комментариев, поэтому спецификация
# всегда соответствует коду. Перегенерировать:
#
#   dotnet run --project src/api --urls http://localhost:5080
#   curl -s http://localhost:5080/swagger/v1/swagger.json > swagger.json
#   python3 -c "import json,yaml,io; d=json.load(io.open('swagger.json',encoding='utf-8-sig')); \
#     io.open('api/openapi.yaml','w',encoding='utf-8').write(yaml.safe_dump(d, allow_unicode=True, sort_keys=False))"
#
# Схема безопасности — Bearer JWT. Токен выдаёт POST /api/auth/login
# и подставляется в поле «Authorization» вручную либо значением
# переменной {{token}} в Postman-коллекции.
openapi: 3.0.4
info:
  title: Система ТОиР-Проф — REST API
  description: 'Учёт технического обслуживания и ремонта: оборудование, график ТО, заявки, бригады, материалы,
    аналитика и отчёты. Все ответы приходят в обёртке { success, data, message, error_code }.'
  version: v1
paths:
  /api/analytics:
    get:
      tags:
      - Analytics
      summary: Полный отчёт за период — пять блоков аналитики в одном ответе.
      description: "Клиент запрашивает его один раз и раскладывает по вкладкам: пять отдельных\r\nзапросов\
        \ означали бы пять одинаковых выборок из одних и тех же таблиц."
      parameters:
      - name: from
        in: query
        description: Начало периода; по умолчанию — 30 дней назад.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Конец периода; по умолчанию — сегодня.
        schema:
          type: string
          format: date
      - name: workshopId
        in: query
        description: Ограничить отчёт одним цехом.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReportApiResponse'
        '400':
          description: 'Некорректные данные запроса. Тело ответа: { success: false, data: null, message:
            «…», error_code: «…» }.'
        '401':
          description: 'Токен не передан или просрочен. Тело ответа: { success: false, data: null, message:
            «…», error_code: «…» }.'
        '403':
          description: 'Недостаточно прав для этой операции. Тело ответа: { success: false, data: null,
            message: «…», error_code: «…» }.'
        '404':
          description: 'Запись с таким идентификатором не найдена. Тело ответа: { success: false, data:
            null, message: «…», error_code: «…» }.'
        '429':
          description: 'Превышен предел частоты запросов. Повторите позже. Тело ответа: { success: false,
            data: null, message: «…», error_code: «…» }.'
        '500':
          description: 'Внутренняя ошибка сервера. Тело ответа: { success: false, data: null, message:
            «…», error_code: «…» }.'
